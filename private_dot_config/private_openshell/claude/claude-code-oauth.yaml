# Claude Code with a subscription OAuth token (`claude setup-token`).
# Based on https://github.com/ai-openshell/openshell/blob/v0.1.9/providers/claude-code.yaml
# The sandbox only sees a placeholder, the proxy injects the real token for api.anthropic.com.
id: claude-code-oauth
display_name: Claude Code (OAuth)
description: Claude Code CLI authenticated with a Claude subscription OAuth token
category: agent
inference_capable: true
credentials:
  - name: oauth_token
    description: Long-lived Claude Code OAuth token from `claude setup-token`
    env_vars: [CLAUDE_CODE_OAUTH_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [oauth_token]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  # Connectivity check on startup
  - host: platform.claude.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
binaries: [/usr/local/bin/claude]
