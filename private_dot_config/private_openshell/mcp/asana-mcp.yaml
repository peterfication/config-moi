# Hosted Asana MCP (https://mcp.asana.com/v2/mcp) with OAuth tokens refreshed by the gateway.
# Log in with `openshell-mcp-login asana`, which uses an existing Asana MCP app (Asana has no
# dynamic client registration). The sandbox only sees a placeholder in ASANA_MCP_TOKEN, the
# proxy injects the current access token into MCP requests from /usr/local/bin/claude.
id: asana-mcp
display_name: Asana MCP
description: Hosted Asana MCP server with OAuth tokens refreshed by the gateway
category: knowledge
credentials:
  - name: access_token
    description: Asana MCP OAuth access token
    env_vars: [ASANA_MCP_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: oauth2_refresh_token
      token_url: https://app.asana.com/-/oauth_token
      refresh_before: "300s"
      material:
        - name: client_id
          description: Asana MCP app client ID
          required: true
        - name: client_secret
          description: Asana MCP app client secret
          required: true
          secret: true
        - name: refresh_token
          description: OAuth refresh token
          required: true
          secret: true
endpoints:
  - host: mcp.asana.com
    port: 443
    path: /v2/mcp
    protocol: mcp
    enforcement: enforce
    mcp:
      allow_all_known_mcp_methods: true
binaries: [/usr/local/bin/claude]
